<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pipe Digital Twin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #0f1117;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    #header {
      background: #1a1d27;
      padding: 10px 20px;
      border-bottom: 1px solid #2a2d3e;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      z-index: 10;
    }
    #header h1 { font-size: 17px; font-weight: 600; color: #fff; flex: 1; }

    /* ── Status bar ── */
    #statusbar {
      background: #131620;
      border-bottom: 1px solid #2a2d3e;
      padding: 6px 20px;
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 12px;
      color: #888;
      flex-shrink: 0;
    }
    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 10px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 12px;
    }
    .chip-ok      { background: rgba(33,150,243,.15);  color: #2196f3; }
    .chip-warn    { background: rgba(255,152,0,.15);  color: #ff9800; }
    .chip-anomaly { background: rgba(244,67,54,.15);  color: #f44336; }
    .chip-anomaly.active { background: rgba(244,67,54,.3); animation: pulse-chip 1.2s infinite; }
    @keyframes pulse-chip { 0%,100%{ opacity:1 } 50%{ opacity:.5 } }
    #last-update { margin-left: auto; color: #555; }

    /* ── Content row (3D scene + panel) ── */
    #content { flex: 1; display: flex; overflow: hidden; }

    /* ── 3D scene ── */
    #twin-wrap { flex: 1; position: relative; cursor: grab; }
    #twin-canvas { width: 100%; height: 100%; display: block; }

    /* ── Legend ── */
    #legend {
      position: absolute;
      bottom: 36px;
      right: 12px;
      background: rgba(26,29,39,.92);
      border: 1px solid #2a2d3e;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      z-index: 5;
      pointer-events: none;
      backdrop-filter: blur(4px);
    }
    #legend h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: #666; margin-bottom: 8px; }
    .legend-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
    .legend-row:last-child { margin-bottom: 0; }
    .legend-dot  { width: 12px; height: 12px; border-radius: 50%; border: 2px solid rgba(255,255,255,.4); flex-shrink: 0; }

    /* ── Detail panel ── */
    #panel {
      width: 300px;
      flex-shrink: 0;
      background: #1a1d27;
      border-left: 1px solid #2a2d3e;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      transform: translateX(100%);
      transition: transform .25s ease;
    }
    #panel.open { transform: translateX(0); }

    .panel-header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid #2a2d3e;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .panel-title { flex: 1; }
    .panel-title h2 { font-size: 14px; font-weight: 600; color: #fff; line-height: 1.4; }
    .panel-title small { font-size: 11px; color: #666; }

    #panel-close {
      background: none;
      border: none;
      color: #666;
      font-size: 20px;
      cursor: pointer;
      line-height: 1;
      padding: 0 2px;
      flex-shrink: 0;
    }
    #panel-close:hover { color: #ccc; }

    /* State badge */
    .state-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .5px;
      text-transform: uppercase;
    }

    /* Camera feed placeholder */
    #camera-wrap {
      margin: 14px 16px 0;
    }
    #camera-wrap label { font-size: 11px; text-transform: uppercase; letter-spacing: .7px; color: #555; display: block; margin-bottom: 6px; }
    #camera-feed {
      background: #0a0c14;
      border: 1.5px dashed #2a2d3e;
      border-radius: 6px;
      height: 170px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #444;
      font-size: 12px;
    }
    #camera-feed svg { opacity: .4; }

    /* Stats grid */
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 14px 16px 0;
    }
    .stat-box {
      background: #131620;
      border: 1px solid #2a2d3e;
      border-radius: 6px;
      padding: 10px 12px;
    }
    .stat-box .label { font-size: 10px; text-transform: uppercase; letter-spacing: .6px; color: #555; margin-bottom: 4px; }
    .stat-box .value { font-size: 20px; font-weight: 700; color: #fff; }
    .stat-box .unit  { font-size: 11px; color: #666; }

    /* Trend indicator */
    #trend-row {
      margin: 12px 16px 0;
      font-size: 13px;
      color: #888;
    }
    #trend-row b { color: #e0e0e0; }

    /* Divider */
    .divider { height: 1px; background: #2a2d3e; margin: 14px 0; }

    /* Force anomaly button */
    #btn-anomaly {
      margin: 0 16px 16px;
      padding: 9px 0;
      width: calc(100% - 32px);
      background: rgba(244,67,54,.12);
      border: 1px solid rgba(244,67,54,.4);
      border-radius: 6px;
      color: #f44336;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    #btn-anomaly:hover { background: rgba(244,67,54,.22); }
    #btn-anomaly:disabled { opacity: .4; cursor: not-allowed; }

    #panel-hint {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(26,29,39,.88);
      border: 1px solid #2a2d3e;
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 12px;
      color: #777;
      pointer-events: none;
      backdrop-filter: blur(4px);
      z-index: 5;
      white-space: nowrap;
      transition: opacity .3s;
    }
    #panel-hint.hidden { opacity: 0; }
  </style>
</head>
<body>

  <!-- Header -->
  <div id="header">
    <span style="font-size:22px">🔧</span>
    <h1>Pipe Digital Twin — Pipeline Monitor</h1>
  </div>

  <!-- Status bar -->
  <div id="statusbar">
    <span>Live status:</span>
    <span id="chip-ok"      class="status-chip chip-ok">● 3 Normal</span>
    <span id="chip-warn"    class="status-chip chip-warn">● 0 Warning</span>
    <span id="chip-anomaly" class="status-chip chip-anomaly">● 0 Anomaly</span>
    <span id="last-update">—</span>
  </div>

  <!-- 3D scene + side panel -->
  <div id="content">

    <div id="twin-wrap">
      <canvas id="twin-canvas"></canvas>

      <!-- Legend -->
      <div id="legend">
        <h3>Status</h3>
        <div class="legend-row"><div class="legend-dot" style="background:#2196f3;box-shadow:0 0 6px #2196f3"></div> Normal</div>
        <div class="legend-row"><div class="legend-dot" style="background:#ff9800;box-shadow:0 0 6px #ff9800"></div> Warning</div>
        <div class="legend-row"><div class="legend-dot" style="background:#f44336;box-shadow:0 0 6px #f44336"></div> Anomaly</div>
      </div>

      <!-- Click-hint (fades when panel opens) -->
      <div id="panel-hint">Drag to rotate · click a node to inspect</div>
    </div>

    <!-- Detail panel -->
    <div id="panel">
      <div class="panel-header">
        <div class="panel-title">
          <h2 id="panel-name">—</h2>
          <small id="panel-last-seen">—</small>
        </div>
        <button id="panel-close" onclick="closePanel()">×</button>
      </div>

      <!-- State badge -->
      <div style="padding: 12px 16px 0; display:flex; align-items:center; gap:10px;">
        <span id="panel-badge" class="state-badge">—</span>
      </div>

      <!-- Camera feed placeholder -->
      <div id="camera-wrap">
        <label>Camera Feed</label>
        <div id="camera-feed">
          <!-- Camera icon -->
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
          <span>Live feed — hardware not connected</span>
        </div>
      </div>

      <!-- Stats grid -->
      <div class="stat-grid">
        <div class="stat-box">
          <div class="label">Temperature</div>
          <div class="value" id="panel-temp">—</div>
          <div class="unit">°C</div>
        </div>
        <div class="stat-box">
          <div class="label">Normal range</div>
          <div class="value" id="panel-range" style="font-size:14px;padding-top:4px">—</div>
          <div class="unit">°C</div>
        </div>
      </div>

      <!-- Trend -->
      <div id="trend-row">
        Trend: <b id="panel-trend">—</b>
      </div>

      <div class="divider" style="margin: 14px 16px 0;"></div>

      <!-- Force anomaly (demo) -->
      <div style="padding: 0 16px 4px; font-size: 11px; color:#555; text-transform:uppercase; letter-spacing:.6px; margin-top:12px;">
        Demo controls
      </div>
      <button id="btn-anomaly" onclick="forceAnomaly()">
        ⚠ Trigger Anomaly on this Node
      </button>
    </div><!-- /panel -->

  </div><!-- /content -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>

    // ── CONSTANTS ─────────────────────────────────────────────────────────────────
    const POLL_INTERVAL = 3000;

    const STATE_COLOR_HEX = { normal: 0x2196f3, warning: 0xff9800, anomaly: 0xf44336, unknown: 0x9e9e9e };
    function stateColorHex(s) { return STATE_COLOR_HEX[s] ?? STATE_COLOR_HEX.unknown; }
    function stateColorCss(s) { return '#' + stateColorHex(s).toString(16).padStart(6, '0'); }

    // ── LIVE STATE (rebuilt from /api/twin-state, not hardcoded) ──────────────────
    let NODES = [];                    // [{id, name, state, temp, trend, last_seen, temp_normal}]
    let selectedNodeId = null;
    let builtNodeCount = 0;

    // ── THREE.JS SCENE ──────────────────────────────────────────────────────────────
    const wrap = document.getElementById('twin-wrap');
    const canvas = document.getElementById('twin-canvas');

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, wrap.clientWidth / wrap.clientHeight, 0.1, 100);
    camera.position.set(0, 2.4, 7.2);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(wrap.clientWidth, wrap.clientHeight);
    renderer.setClearColor(0x000000, 0);

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.9);
    dirLight1.position.set(4, 5, 3);
    scene.add(dirLight1);
    const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
    dirLight2.position.set(-3, -2, -4);
    scene.add(dirLight2);

    const group = new THREE.Group();
    scene.add(group);

    const nodeMeshMap = new Map(); // nodeId → mesh

    function buildCurve(n) {
      const segs = Math.max(n, 2);
      const pts = [];
      for (let i = 0; i <= segs; i++) {
        const x = -3.4 + (6.8 * i) / segs;
        const z = 0.6 * Math.sin((i / segs) * Math.PI * 2);
        const y = 0.3 * Math.sin((i / segs) * Math.PI * 3 + 1);
        pts.push(new THREE.Vector3(x, y, z));
      }
      return new THREE.CatmullRomCurve3(pts);
    }

    function buildScene(nodeList) {
      [...group.children].forEach(c => group.remove(c));
      nodeMeshMap.clear();
      if (nodeList.length === 0) return;

      const curve = buildCurve(nodeList.length);
      const tubeGeo = new THREE.TubeGeometry(curve, 64, 0.32, 16, false);
      const tubeMat = new THREE.MeshStandardMaterial({ color: 0x3a3f55, roughness: 0.55, metalness: 0.15 });
      group.add(new THREE.Mesh(tubeGeo, tubeMat));

      nodeList.forEach((node, i) => {
        const t = (i + 0.5) / nodeList.length;
        const pos = curve.getPointAt(t);
        const geo = new THREE.SphereGeometry(0.42, 24, 24);
        const mat = new THREE.MeshStandardMaterial({ color: stateColorHex(node.state), roughness: 0.4, metalness: 0.1 });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.copy(pos);
        mesh.userData.id = node.id;
        group.add(mesh);
        nodeMeshMap.set(node.id, mesh);
      });
    }

    // ── DRAG TO ROTATE + CLICK/HOVER ON NODES ──────────────────────────────────────
    let dragging = false, downX = 0, downY = 0, lastX = 0, lastY = 0;
    let rotY = 0.4, rotX = 0.12, autoRotate = true;
    let hoveredMesh = null;

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    function setMouseFromEvent(e) {
      const rect = canvas.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    }

    function pickNodeMesh(e) {
      setMouseFromEvent(e);
      raycaster.setFromCamera(mouse, camera);
      const meshes = [...nodeMeshMap.values()];
      const hits = raycaster.intersectObjects(meshes);
      return hits.length ? hits[0].object : null;
    }

    wrap.addEventListener('pointerdown', e => {
      dragging = true; autoRotate = false;
      downX = lastX = e.clientX; downY = lastY = e.clientY;
      wrap.style.cursor = 'grabbing';
    });

    window.addEventListener('pointerup', e => {
      if (dragging && Math.hypot(e.clientX - downX, e.clientY - downY) < 6) {
        const mesh = pickNodeMesh(e);
        if (mesh) openPanel(mesh.userData.id);
      }
      dragging = false;
      wrap.style.cursor = 'grab';
    });

    window.addEventListener('pointermove', e => {
      if (!dragging) {
        const mesh = pickNodeMesh(e);
        if (hoveredMesh && hoveredMesh !== mesh) hoveredMesh.scale.set(1, 1, 1);
        if (mesh) { mesh.scale.set(1.25, 1.25, 1.25); wrap.style.cursor = 'pointer'; }
        else wrap.style.cursor = 'grab';
        hoveredMesh = mesh;
        return;
      }
      rotY += (e.clientX - lastX) * 0.005;
      rotX += (e.clientY - lastY) * 0.005;
      rotX = Math.max(-0.8, Math.min(0.8, rotX));
      lastX = e.clientX; lastY = e.clientY;
    });

    function onResize() {
      camera.aspect = wrap.clientWidth / wrap.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(wrap.clientWidth, wrap.clientHeight);
    }
    new ResizeObserver(onResize).observe(wrap);

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      if (autoRotate) rotY += 0.0025;
      group.rotation.y = rotY;
      group.rotation.x = rotX;

      nodeMeshMap.forEach((mesh, id) => {
        if (mesh === hoveredMesh) return;
        const node = NODES.find(n => n.id === id);
        if (node && node.state === 'anomaly') {
          const s = 1 + 0.12 * Math.sin(t * 4);
          mesh.scale.set(s, s, s);
        } else {
          mesh.scale.set(1, 1, 1);
        }
      });

      renderer.render(scene, camera);
    }
    animate();

    // ── PANEL ─────────────────────────────────────────────────────────────────────
    function openPanel(nodeId) {
      selectedNodeId = nodeId;
      document.getElementById('panel-hint').classList.add('hidden');
      document.getElementById('panel').classList.add('open');
      refreshPanel();
    }

    function closePanel() {
      selectedNodeId = null;
      document.getElementById('panel').classList.remove('open');
      document.getElementById('panel-hint').classList.remove('hidden');
    }

    function refreshPanel() {
      if (selectedNodeId === null) return;
      const node = NODES.find(n => n.id === selectedNodeId);
      if (!node) return;

      const color = stateColorCss(node.state);

      document.getElementById('panel-name').textContent      = node.name;
      document.getElementById('panel-last-seen').textContent = node.last_seen
        ? `Last seen: ${new Date(node.last_seen).toLocaleTimeString()}`
        : 'Waiting for data…';

      const badge = document.getElementById('panel-badge');
      badge.textContent    = node.state.toUpperCase();
      badge.style.cssText  = `background:${color}22;color:${color};border:1px solid ${color}66;` +
                              'padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;letter-spacing:.5px;';

      document.getElementById('panel-temp').textContent  = node.temp != null ? node.temp : '—';
      document.getElementById('panel-temp').style.color  = color;
      document.getElementById('panel-range').textContent =
        node.temp_normal ? `${node.temp_normal[0]}–${node.temp_normal[1]}` : '—';
      document.getElementById('panel-trend').textContent = node.trend || '—';

      document.getElementById('camera-feed').style.borderColor =
        node.state !== 'normal' ? `${color}66` : '#2a2d3e';
    }

    // ── FORCE ANOMALY (demo) ──────────────────────────────────────────────────────
    async function forceAnomaly() {
      if (selectedNodeId === null) return;
      const btn = document.getElementById('btn-anomaly');
      btn.disabled = true;
      btn.textContent = 'Triggering…';

      try {
        await fetch('/api/demo-anomaly', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ segment_id: selectedNodeId })
        });
        await poll();
      } catch (e) {
        console.error('demo-anomaly failed', e);
      } finally {
        btn.disabled = false;
        btn.textContent = '⚠ Trigger Anomaly on this Node';
      }
    }

    // ── STATUS BAR ────────────────────────────────────────────────────────────────
    function updateStatusBar(data) {
      const normal  = Object.values(data.segments).filter(s => s.state === 'normal').length;
      const warn    = (data.warnings  || []).length;
      const anomaly = (data.anomalies || []).length;

      document.getElementById('chip-ok').textContent      = `● ${normal} Normal`;
      document.getElementById('chip-warn').textContent    = `● ${warn} Warning`;
      document.getElementById('chip-anomaly').textContent = `● ${anomaly} Anomaly`;
      document.getElementById('chip-anomaly').classList.toggle('active', anomaly > 0);

      document.getElementById('last-update').textContent =
        `Last update: ${new Date(data.timestamp).toLocaleTimeString()}`;
    }

    // ── POLL /api/twin-state ──────────────────────────────────────────────────────
    async function poll() {
      try {
        const res  = await fetch('/api/twin-state');
        const data = await res.json();

        const ids = Object.keys(data.segments).map(Number).sort((a, b) => a - b);
        NODES = ids.map(id => ({ id, ...data.segments[id] }));

        if (ids.length !== builtNodeCount) {
          buildScene(NODES);
          builtNodeCount = ids.length;
        } else {
          NODES.forEach(node => {
            const mesh = nodeMeshMap.get(node.id);
            if (mesh) mesh.material.color.setHex(stateColorHex(node.state));
          });
        }

        updateStatusBar(data);
        refreshPanel();
      } catch (err) {
        console.warn('Poll failed:', err);
        document.getElementById('last-update').textContent = 'Connection lost — retrying…';
      }
    }

    poll();
    setInterval(poll, POLL_INTERVAL);

  </script>
</body>
</html>
