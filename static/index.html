<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pipe Digital Twin</title>
  <link rel="stylesheet" href="/static/maplibre-gl.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #0f1117;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    #header {
      background: #1a1d27;
      padding: 10px 20px;
      border-bottom: 1px solid #2a2d3e;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      z-index: 10;
    }
    #header h1 { font-size: 17px; font-weight: 600; color: #fff; flex: 1; }

    /* ── Status bar ── */
    #statusbar {
      background: #131620;
      border-bottom: 1px solid #2a2d3e;
      padding: 6px 20px;
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 12px;
      color: #888;
      flex-shrink: 0;
    }
    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 10px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 12px;
    }
    .chip-ok      { background: rgba(76,175,80,.15);  color: #4caf50; }
    .chip-warn    { background: rgba(255,152,0,.15);  color: #ff9800; }
    .chip-anomaly { background: rgba(244,67,54,.15);  color: #f44336; }
    .chip-anomaly.active { background: rgba(244,67,54,.3); animation: pulse-chip 1.2s infinite; }
    @keyframes pulse-chip { 0%,100%{ opacity:1 } 50%{ opacity:.5 } }
    #last-update { margin-left: auto; color: #555; }

    /* ── Content row (map + panel) ── */
    #content { flex: 1; display: flex; overflow: hidden; }

    /* ── Map ── */
    #map-wrap { flex: 1; position: relative; }
    #map { width: 100%; height: 100%; }

    /* ── Legend ── */
    #legend {
      position: absolute;
      bottom: 36px;
      right: 12px;
      background: rgba(26,29,39,.92);
      border: 1px solid #2a2d3e;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      z-index: 5;
      pointer-events: none;
      backdrop-filter: blur(4px);
    }
    #legend h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: #666; margin-bottom: 8px; }
    .legend-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
    .legend-row:last-child { margin-bottom: 0; }
    .legend-dot  { width: 12px; height: 12px; border-radius: 50%; border: 2px solid rgba(255,255,255,.4); flex-shrink: 0; }
    .legend-line { width: 24px; height: 4px; border-radius: 2px; flex-shrink: 0; }

    /* ── Detail panel ── */
    #panel {
      width: 300px;
      flex-shrink: 0;
      background: #1a1d27;
      border-left: 1px solid #2a2d3e;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      transform: translateX(100%);
      transition: transform .25s ease;
    }
    #panel.open { transform: translateX(0); }

    .panel-header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid #2a2d3e;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .panel-title { flex: 1; }
    .panel-title h2 { font-size: 14px; font-weight: 600; color: #fff; line-height: 1.4; }
    .panel-title small { font-size: 11px; color: #666; }

    #panel-close {
      background: none;
      border: none;
      color: #666;
      font-size: 20px;
      cursor: pointer;
      line-height: 1;
      padding: 0 2px;
      flex-shrink: 0;
    }
    #panel-close:hover { color: #ccc; }

    /* State badge */
    .state-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .5px;
      text-transform: uppercase;
    }

    /* Camera feed placeholder */
    #camera-wrap {
      margin: 14px 16px 0;
    }
    #camera-wrap label { font-size: 11px; text-transform: uppercase; letter-spacing: .7px; color: #555; display: block; margin-bottom: 6px; }
    #camera-feed {
      background: #0a0c14;
      border: 1.5px dashed #2a2d3e;
      border-radius: 6px;
      height: 170px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #444;
      font-size: 12px;
      overflow: hidden;
    }
    #camera-feed svg { opacity: .4; }
    #camera-stream {
      width: 100%; height: 100%;
      object-fit: cover;
      border-radius: 5px;
      display: none;
    }

    /* Stats grid */
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 14px 16px 0;
    }
    .stat-box {
      background: #131620;
      border: 1px solid #2a2d3e;
      border-radius: 6px;
      padding: 10px 12px;
    }
    .stat-box .label { font-size: 10px; text-transform: uppercase; letter-spacing: .6px; color: #555; margin-bottom: 4px; }
    .stat-box .value { font-size: 20px; font-weight: 700; color: #fff; }
    .stat-box .unit  { font-size: 11px; color: #666; }

    /* Trend indicator */
    #trend-row {
      margin: 12px 16px 0;
      font-size: 13px;
      color: #888;
    }
    #trend-row b { color: #e0e0e0; }

    /* Divider */
    .divider { height: 1px; background: #2a2d3e; margin: 14px 0; }

    /* Force anomaly button */
    #btn-anomaly {
      margin: 0 16px 16px;
      padding: 9px 0;
      width: calc(100% - 32px);
      background: rgba(244,67,54,.12);
      border: 1px solid rgba(244,67,54,.4);
      border-radius: 6px;
      color: #f44336;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    #btn-anomaly:hover { background: rgba(244,67,54,.22); }
    #btn-anomaly:disabled { opacity: .4; cursor: not-allowed; }

    #panel-hint {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(26,29,39,.88);
      border: 1px solid #2a2d3e;
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 12px;
      color: #777;
      pointer-events: none;
      backdrop-filter: blur(4px);
      z-index: 5;
      white-space: nowrap;
      transition: opacity .3s;
    }
    #panel-hint.hidden { opacity: 0; }
  </style>
</head>
<body>

  <!-- Header -->
  <div id="header">
    <span style="font-size:22px">🔧</span>
    <h1>Pipe Digital Twin — Pipeline Monitor</h1>
    <a href="/logout" style="margin-left:auto;padding:6px 14px;background:#1a1d27;border:1px solid #2a2d3e;border-radius:6px;color:#888;font-size:12px;text-decoration:none;">Sign out</a>
  </div>

  <!-- Status bar -->
  <div id="statusbar">
    <span>Live status:</span>
    <span id="chip-ok"      class="status-chip chip-ok">● 3 Normal</span>
    <span id="chip-warn"    class="status-chip chip-warn">● 0 Warning</span>
    <span id="chip-anomaly" class="status-chip chip-anomaly">● 0 Anomaly</span>
    <span id="last-update">—</span>
  </div>

  <!-- Map + side panel -->
  <div id="content">

    <div id="map-wrap">
      <div id="map"></div>

      <!-- Legend -->
      <div id="legend">
        <h3>Status</h3>
        <div class="legend-row"><div class="legend-line" style="background:#4caf50"></div> Normal</div>
        <div class="legend-row"><div class="legend-line" style="background:#ff9800"></div> Warning</div>
        <div class="legend-row"><div class="legend-line" style="background:#f44336"></div> Anomaly</div>
        <div style="height:8px"></div>
        <div class="legend-row"><div class="legend-dot" style="background:#4caf50;box-shadow:0 0 6px #4caf50"></div> Node — Normal</div>
        <div class="legend-row"><div class="legend-dot" style="background:#ff9800;box-shadow:0 0 6px #ff9800"></div> Node — Warning</div>
        <div class="legend-row"><div class="legend-dot" style="background:#f44336;box-shadow:0 0 6px #f44336"></div> Node — Anomaly</div>
      </div>

      <!-- Click-hint (fades when panel opens) -->
      <div id="panel-hint">Click any node to inspect</div>
    </div>

    <!-- Detail panel -->
    <div id="panel">
      <div class="panel-header">
        <div class="panel-title">
          <h2 id="panel-name">—</h2>
          <small id="panel-last-seen">—</small>
        </div>
        <button id="panel-close" onclick="closePanel()">×</button>
      </div>

      <!-- State badge -->
      <div style="padding: 12px 16px 0; display:flex; align-items:center; gap:10px;">
        <span id="panel-badge" class="state-badge">—</span>
      </div>

      <!-- Camera feed -->
      <div id="camera-wrap">
        <label>Camera Feed</label>
        <div id="camera-feed">
          <img id="camera-stream" src="/video_feed" alt="Live camera feed"
               onerror="this.style.display='none';document.getElementById('camera-placeholder').style.display='contents'">
          <span id="camera-placeholder" style="display:none;flex-direction:column;align-items:center;gap:8px">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="opacity:.4">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
              <circle cx="12" cy="13" r="4"/>
            </svg>
            <span>Camera unavailable</span>
          </span>
        </div>
      </div>

      <!-- Stats grid -->
      <div class="stat-grid">
        <div class="stat-box">
          <div class="label">Temperature</div>
          <div class="value" id="panel-temp">—</div>
          <div class="unit">°C</div>
        </div>
        <div class="stat-box">
          <div class="label">Normal range</div>
          <div class="value" id="panel-range" style="font-size:14px;padding-top:4px">—</div>
          <div class="unit">°C</div>
        </div>
      </div>

      <!-- Trend -->
      <div id="trend-row">
        Trend: <b id="panel-trend">—</b>
      </div>

      <div class="divider" style="margin: 14px 16px 0;"></div>

      <!-- Force anomaly (demo) -->
      <div style="padding: 0 16px 4px; font-size: 11px; color:#555; text-transform:uppercase; letter-spacing:.6px; margin-top:12px;">
        Demo controls
      </div>
      <button id="btn-anomaly" onclick="forceAnomaly()">
        ⚠ Trigger Anomaly on this Node
      </button>
    </div><!-- /panel -->

  </div><!-- /content -->

  <script src="/static/maplibre-gl.js"></script>
  <script>

    // ── CONSTANTS ─────────────────────────────────────────────────────────────────
    const POLL_INTERVAL = 3000;


    const STATE_COLOR = { normal: '#4caf50', warning: '#ff9800', anomaly: '#f44336', unknown: '#9e9e9e' };
    function stateColor(s) { return STATE_COLOR[s] ?? STATE_COLOR.unknown; }
    function stateGlow(s)  { return `0 0 12px ${stateColor(s)}cc`; }

    // ── NODE DEFINITIONS (positions fixed; state/temp overwritten by API) ─────────
    const NODES = [
      { id: 0, name: "Segment A — Near Intake",  lng: 32.850, lat: 39.930, state: "normal", temp: null, trend: "—", temp_normal: [60, 75] },
      { id: 1, name: "Segment B — Mid Run",       lng: 32.865, lat: 39.925, state: "normal", temp: null, trend: "—", temp_normal: [60, 75] },
      { id: 2, name: "Segment C — Near Outflow",  lng: 32.880, lat: 39.920, state: "normal", temp: null, trend: "—", temp_normal: [60, 75] },
    ];

    const SEGMENT_PIPES = [
      [[32.844, 39.932], [32.850, 39.930], [32.858, 39.9275]],
      [[32.858, 39.9275], [32.865, 39.925], [32.872, 39.9225]],
      [[32.872, 39.9225], [32.880, 39.920], [32.886, 39.918]],
    ];

    function buildPipeGeoJSON(nodes) {
      return {
        type: 'FeatureCollection',
        features: nodes.map((n, i) => ({
          type: 'Feature',
          properties: { id: n.id, state: n.state },
          geometry: { type: 'LineString', coordinates: SEGMENT_PIPES[i] }
        }))
      };
    }

    // ── SELECTED NODE ─────────────────────────────────────────────────────────────
    let selectedNodeId = null;

    // ── MAP INIT ──────────────────────────────────────────────────────────────────
    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          osm: {
            type: 'raster',
            tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
            tileSize: 256,
            attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
          }
        },
        layers: [{ id: 'osm-raster', type: 'raster', source: 'osm' }]
      },
      center: [32.865, 39.925],
      zoom: 13
    });

    map.addControl(new maplibregl.NavigationControl(), 'top-right');
    map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }), 'bottom-left');

    const markerEls = new Map();   // nodeId → HTMLElement
    let mapReady = false;

    map.on('load', () => {
      mapReady = true;

      // ── Pipe segments ──────────────────────────────────────────────────────────
      map.addSource('pipes', { type: 'geojson', data: buildPipeGeoJSON(NODES) });

      map.addLayer({
        id: 'pipes-glow',
        type: 'line',
        source: 'pipes',
        paint: { 'line-color': '#fff', 'line-width': 14, 'line-opacity': 0.08 }
      });

      map.addLayer({
        id: 'pipes-line',
        type: 'line',
        source: 'pipes',
        paint: {
          'line-width': 7, 'line-cap': 'round', 'line-join': 'round',
          'line-color': ['match', ['get', 'state'],
            'anomaly', '#f44336', 'warning', '#ff9800', '#4caf50'
          ]
        }
      });

      // ── Node markers ───────────────────────────────────────────────────────────
      NODES.forEach(node => {
        const el = document.createElement('div');
        el.dataset.nodeId = node.id;
        el.style.cssText = [
          'width:20px', 'height:20px', 'border-radius:50%',
          `background:${stateColor(node.state)}`, 'border:3px solid #fff',
          `box-shadow:${stateGlow(node.state)}`,
          'cursor:pointer', 'transition:box-shadow .3s ease, outline .1s ease',
        ].join(';');

        el.addEventListener('mouseenter', () => el.style.outline = '3px solid rgba(255,255,255,0.7)');
        el.addEventListener('mouseleave', () => el.style.outline = '');
        el.addEventListener('click', () => openPanel(node.id));

        new maplibregl.Marker({ element: el })
          .setLngLat([node.lng, node.lat])
          .addTo(map);

        markerEls.set(node.id, el);
      });

      // Start polling
      poll();
      setInterval(poll, POLL_INTERVAL);
    });

    // ── PANEL ─────────────────────────────────────────────────────────────────────
    function openPanel(nodeId) {
      selectedNodeId = nodeId;
      document.getElementById('panel-hint').classList.add('hidden');
      document.getElementById('panel').classList.add('open');
      document.getElementById('camera-stream').style.display = 'block';
      map.resize();
      refreshPanel();
    }

    function closePanel() {
      selectedNodeId = null;
      document.getElementById('panel').classList.remove('open');
      document.getElementById('panel-hint').classList.remove('hidden');
      map.resize();
    }

    function refreshPanel() {
      if (selectedNodeId === null) return;
      const node = NODES.find(n => n.id === selectedNodeId);
      if (!node) return;

      const color = stateColor(node.state);

      document.getElementById('panel-name').textContent      = node.name;
      document.getElementById('panel-last-seen').textContent = node.last_seen
        ? `Last seen: ${new Date(node.last_seen).toLocaleTimeString()}`
        : 'Waiting for data…';

      const badge = document.getElementById('panel-badge');
      badge.textContent    = node.state.toUpperCase();
      badge.style.cssText  = `background:${color}22;color:${color};border:1px solid ${color}66;` +
                              'padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;letter-spacing:.5px;';

      document.getElementById('panel-temp').textContent  = node.temp != null ? node.temp : '—';
      document.getElementById('panel-temp').style.color  = color;
      document.getElementById('panel-range').textContent =
        node.temp_normal ? `${node.temp_normal[0]}–${node.temp_normal[1]}` : '—';
      document.getElementById('panel-trend').textContent = node.trend || '—';

      // Tint the camera placeholder border to match state
      document.getElementById('camera-feed').style.borderColor =
        node.state !== 'normal' ? `${color}66` : '#2a2d3e';
    }

    // ── FORCE ANOMALY (demo) ──────────────────────────────────────────────────────
    async function forceAnomaly() {
      if (selectedNodeId === null) return;
      const btn = document.getElementById('btn-anomaly');
      btn.disabled = true;
      btn.textContent = 'Triggering…';

      try {
        await fetch('/api/demo-anomaly', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ segment_id: selectedNodeId })
        });
        // The next poll will pick up the change
        await poll();
      } catch (e) {
        console.error('demo-anomaly failed', e);
      } finally {
        btn.disabled = false;
        btn.textContent = '⚠ Trigger Anomaly on this Node';
      }
    }

    // ── APPLY STATE UPDATES ───────────────────────────────────────────────────────
    function applyNodeStates(nodes) {
      nodes.forEach(node => {
        const el = markerEls.get(node.id);
        if (el) {
          el.style.background = stateColor(node.state);
          el.style.boxShadow  = stateGlow(node.state);
        }
      });
      if (mapReady) map.getSource('pipes').setData(buildPipeGeoJSON(nodes));
      refreshPanel();  // keep the open panel in sync
    }

    // ── STATUS BAR ────────────────────────────────────────────────────────────────
    function updateStatusBar(data) {
      const normal  = Object.values(data.segments).filter(s => s.state === 'normal').length;
      const warn    = (data.warnings  || []).length;
      const anomaly = (data.anomalies || []).length;

      document.getElementById('chip-ok').textContent      = `● ${normal} Normal`;
      document.getElementById('chip-warn').textContent    = `● ${warn} Warning`;
      document.getElementById('chip-anomaly').textContent = `● ${anomaly} Anomaly`;
      document.getElementById('chip-anomaly').classList.toggle('active', anomaly > 0);

      document.getElementById('last-update').textContent =
        `Last update: ${new Date(data.timestamp).toLocaleTimeString()}`;
    }

    // ── POLL /api/twin-state ──────────────────────────────────────────────────────
    async function poll() {
      try {
        const res  = await fetch('/api/twin-state');
        const data = await res.json();

        NODES.forEach(node => {
          const seg = data.segments[node.id];
          if (!seg) return;
          node.state      = seg.state;
          node.temp       = seg.temp;
          node.trend      = seg.trend;
          node.last_seen  = seg.last_seen;
          if (seg.temp_normal) node.temp_normal = seg.temp_normal;
        });

        applyNodeStates(NODES);
        updateStatusBar(data);
      } catch (err) {
        console.warn('Poll failed:', err);
        document.getElementById('last-update').textContent = 'Connection lost — retrying…';
      }
    }

  </script>
</body>
</html>
