<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pipe Digital Twin</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #0f1117;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    #header {
      background: #1a1d27;
      padding: 10px 20px;
      border-bottom: 1px solid #2a2d3e;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      z-index: 10;
    }
    #header h1 { font-size: 17px; font-weight: 600; color: #fff; flex: 1; }

    /* ── Status bar ── */
    #statusbar {
      background: #131620;
      border-bottom: 1px solid #2a2d3e;
      padding: 6px 20px;
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 12px;
      color: #888;
      flex-shrink: 0;
      z-index: 10;
    }
    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 10px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 12px;
    }
    .chip-ok      { background: rgba(76,175,80,.15);  color: #4caf50; }
    .chip-warn    { background: rgba(255,152,0,.15);  color: #ff9800; }
    .chip-anomaly { background: rgba(244,67,54,.15);  color: #f44336; }
    .chip-anomaly.active { background: rgba(244,67,54,.3); animation: pulse-chip 1.2s infinite; }
    @keyframes pulse-chip { 0%,100%{ opacity:1 } 50%{ opacity:.55 } }

    #last-update { margin-left: auto; color: #555; }

    /* ── Map wrapper ── */
    #map-wrap { flex: 1; position: relative; overflow: hidden; }
    #map { width: 100%; height: 100%; }

    /* ── Legend ── */
    #legend {
      position: absolute;
      bottom: 36px;
      right: 12px;
      background: rgba(26,29,39,0.92);
      border: 1px solid #2a2d3e;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      z-index: 5;
      pointer-events: none;
      backdrop-filter: blur(4px);
    }
    #legend h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: #666; margin-bottom: 8px; }
    .legend-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
    .legend-row:last-child { margin-bottom: 0; }
    .legend-dot  { width: 12px; height: 12px; border-radius: 50%; border: 2px solid rgba(255,255,255,.4); flex-shrink: 0; }
    .legend-line { width: 24px; height: 4px; border-radius: 2px; flex-shrink: 0; }

    /* ── MapLibre popup overrides ── */
    .maplibregl-popup-content {
      background: #1a1d27;
      color: #e0e0e0;
      border: 1px solid #2a2d3e;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 13px;
      line-height: 1.7;
      box-shadow: 0 4px 20px rgba(0,0,0,.5);
    }
    .maplibregl-popup-anchor-bottom .maplibregl-popup-tip { border-top-color: #1a1d27; }
    .maplibregl-popup-anchor-top    .maplibregl-popup-tip { border-bottom-color: #1a1d27; }
    .maplibregl-popup-close-button { color: #9e9e9e; font-size: 18px; padding: 4px 8px; }
    .maplibregl-popup-close-button:hover { color: #fff; background: transparent; }
  </style>
</head>
<body>

  <!-- Header -->
  <div id="header">
    <span style="font-size:22px">🔧</span>
    <h1>Pipe Digital Twin — Pipeline Monitor</h1>
  </div>

  <!-- Live status bar -->
  <div id="statusbar">
    <span>Live status:</span>
    <span id="chip-ok"      class="status-chip chip-ok">● 3 Normal</span>
    <span id="chip-warn"    class="status-chip chip-warn">● 0 Warning</span>
    <span id="chip-anomaly" class="status-chip chip-anomaly">● 0 Anomaly</span>
    <span id="last-update">—</span>
  </div>

  <!-- Map + legend -->
  <div id="map-wrap">
    <div id="map"></div>

    <div id="legend">
      <h3>Status</h3>
      <div class="legend-row"><div class="legend-line" style="background:#4caf50"></div> Normal</div>
      <div class="legend-row"><div class="legend-line" style="background:#ff9800"></div> Warning</div>
      <div class="legend-row"><div class="legend-line" style="background:#f44336"></div> Anomaly</div>
      <div style="height:8px"></div>
      <div class="legend-row"><div class="legend-dot" style="background:#4caf50;box-shadow:0 0 6px #4caf50"></div> Node — Normal</div>
      <div class="legend-row"><div class="legend-dot" style="background:#ff9800;box-shadow:0 0 6px #ff9800"></div> Node — Warning</div>
      <div class="legend-row"><div class="legend-dot" style="background:#f44336;box-shadow:0 0 6px #f44336"></div> Node — Anomaly</div>
    </div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script>

    // ── CONSTANTS ─────────────────────────────────────────────────────────────────
    const POLL_INTERVAL = 3000; // ms

    const STATE_COLOR = {
      normal:  '#4caf50',
      warning: '#ff9800',
      anomaly: '#f44336',
      unknown: '#9e9e9e',
    };
    function stateColor(s) { return STATE_COLOR[s] ?? STATE_COLOR.unknown; }
    function stateGlow(s)  { return `0 0 12px ${stateColor(s)}cc`; }

    // ── HARDCODED NODE DEFINITIONS (positions & names) ────────────────────────────
    // State and temperature fields will be overwritten by live API data
    const NODES = [
      { id: 0, name: "Segment A — Near Intake",  lng: 32.850, lat: 39.930, state: "normal", temp: null, trend: "—" },
      { id: 1, name: "Segment B — Mid Run",       lng: 32.865, lat: 39.925, state: "normal", temp: null, trend: "—" },
      { id: 2, name: "Segment C — Near Outflow",  lng: 32.880, lat: 39.920, state: "normal", temp: null, trend: "—" },
    ];

    // Each node monitors one stretch of pipe; consecutive segments share endpoints
    const SEGMENT_PIPES = [
      [[32.844, 39.932], [32.850, 39.930], [32.858, 39.9275]],
      [[32.858, 39.9275], [32.865, 39.925], [32.872, 39.9225]],
      [[32.872, 39.9225], [32.880, 39.920], [32.886, 39.918]],
    ];

    function buildPipeGeoJSON(nodes) {
      return {
        type: 'FeatureCollection',
        features: nodes.map((node, i) => ({
          type: 'Feature',
          properties: { id: node.id, state: node.state },
          geometry: { type: 'LineString', coordinates: SEGMENT_PIPES[i] }
        }))
      };
    }

    // ── MAP INIT ──────────────────────────────────────────────────────────────────
    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          osm: {
            type: 'raster',
            tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
            tileSize: 256,
            attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
          }
        },
        layers: [{ id: 'osm-raster', type: 'raster', source: 'osm' }]
      },
      center: [32.865, 39.925],
      zoom: 13
    });

    map.addControl(new maplibregl.NavigationControl(), 'top-right');
    map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }), 'bottom-left');

    // Track marker DOM elements so we can update their colors during polling
    const markerEls  = new Map();   // nodeId → HTMLElement
    const markerObjs = new Map();   // nodeId → maplibregl.Marker (to access popup)
    let mapReady = false;

    map.on('load', () => {
      mapReady = true;

      // ── Pipe segments ──────────────────────────────────────────────────────────
      map.addSource('pipes', { type: 'geojson', data: buildPipeGeoJSON(NODES) });

      map.addLayer({
        id: 'pipes-glow',
        type: 'line',
        source: 'pipes',
        paint: { 'line-color': '#fff', 'line-width': 14, 'line-opacity': 0.08 }
      });

      map.addLayer({
        id: 'pipes-line',
        type: 'line',
        source: 'pipes',
        paint: {
          'line-width': 7,
          'line-cap': 'round',
          'line-join': 'round',
          'line-color': ['match', ['get', 'state'],
            'anomaly', '#f44336',
            'warning', '#ff9800',
            '#4caf50'
          ]
        }
      });

      // ── Node markers ───────────────────────────────────────────────────────────
      NODES.forEach(node => {
        const el = document.createElement('div');
        el.dataset.nodeId = node.id;
        el.style.cssText = [
          'width:20px', 'height:20px', 'border-radius:50%',
          `background:${stateColor(node.state)}`,
          'border:3px solid #fff',
          `box-shadow:${stateGlow(node.state)}`,
          'cursor:pointer', 'transition:transform .15s ease',
        ].join(';');

        el.addEventListener('mouseenter', () => el.style.transform = 'scale(1.35)');
        el.addEventListener('mouseleave', () => el.style.transform = 'scale(1)');

        const popup = new maplibregl.Popup({ offset: 22 })
          .setHTML(buildPopupHTML(node));

        const marker = new maplibregl.Marker({ element: el })
          .setLngLat([node.lng, node.lat])
          .setPopup(popup)
          .addTo(map);

        markerEls.set(node.id, el);
        markerObjs.set(node.id, marker);
      });

      // Start polling immediately
      poll();
      setInterval(poll, POLL_INTERVAL);
    });

    // ── POPUP HTML ────────────────────────────────────────────────────────────────
    function buildPopupHTML(node) {
      const tempStr = node.temp != null ? `${node.temp} °C` : '—';
      return `
        <strong style="font-size:14px">${node.name}</strong><br>
        <span style="color:#aaa">Temperature:</span> <b>${tempStr}</b><br>
        <span style="color:#aaa">State:</span>
          <b style="color:${stateColor(node.state)}">${node.state.toUpperCase()}</b><br>
        <span style="color:#aaa">Trend:</span> ${node.trend}
      `;
    }

    // ── APPLY STATE UPDATES TO MAP + MARKERS ─────────────────────────────────────
    function applyNodeStates(nodes) {
      nodes.forEach(node => {
        const el = markerEls.get(node.id);
        if (el) {
          el.style.background = stateColor(node.state);
          el.style.boxShadow  = stateGlow(node.state);
        }
        const m = markerObjs.get(node.id);
        if (m) m.getPopup().setHTML(buildPopupHTML(node));
      });

      if (mapReady) {
        map.getSource('pipes').setData(buildPipeGeoJSON(nodes));
      }
    }

    // ── STATUS BAR ────────────────────────────────────────────────────────────────
    function updateStatusBar(data) {
      const normal  = Object.values(data.segments).filter(s => s.state === 'normal').length;
      const warn    = (data.warnings  || []).length;
      const anomaly = (data.anomalies || []).length;

      document.getElementById('chip-ok').textContent      = `● ${normal} Normal`;
      document.getElementById('chip-warn').textContent    = `● ${warn} Warning`;
      document.getElementById('chip-anomaly').textContent = `● ${anomaly} Anomaly`;

      const chipA = document.getElementById('chip-anomaly');
      chipA.classList.toggle('active', anomaly > 0);

      const ts = new Date(data.timestamp);
      document.getElementById('last-update').textContent =
        `Last update: ${ts.toLocaleTimeString()}`;
    }

    // ── POLL /api/twin-state ──────────────────────────────────────────────────────
    async function poll() {
      try {
        const res  = await fetch('/api/twin-state');
        const data = await res.json();

        // Merge API data into local node list (preserving hardcoded positions/names)
        const updated = NODES.map(node => {
          const seg = data.segments[node.id];
          if (!seg) return node;
          return { ...node, state: seg.state, temp: seg.temp, trend: seg.trend };
        });

        // Mutate NODES in place so applyNodeStates always has fresh data
        updated.forEach((u, i) => Object.assign(NODES[i], u));

        applyNodeStates(NODES);
        updateStatusBar(data);
      } catch (err) {
        console.warn('Poll failed:', err);
        document.getElementById('last-update').textContent = 'Connection lost — retrying…';
      }
    }

  </script>
</body>
</html>
