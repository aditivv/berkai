<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pipe Digital Twin</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #0f1117;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    #header {
      background: #1a1d27;
      padding: 12px 20px;
      border-bottom: 1px solid #2a2d3e;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      z-index: 10;
    }
    #header h1 { font-size: 17px; font-weight: 600; color: #fff; }

    /* ── Map wrapper ── */
    #map-wrap { flex: 1; position: relative; }
    #map { width: 100%; height: 100%; }

    /* ── Legend ── */
    #legend {
      position: absolute;
      bottom: 36px;
      right: 12px;
      background: rgba(26,29,39,0.92);
      border: 1px solid #2a2d3e;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      z-index: 5;
      pointer-events: none;
      backdrop-filter: blur(4px);
    }
    #legend h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: #888; margin-bottom: 8px; }
    .legend-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
    .legend-row:last-child { margin-bottom: 0; }
    .legend-dot {
      width: 12px; height: 12px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.5); flex-shrink: 0;
    }
    .legend-line {
      width: 24px; height: 4px; border-radius: 2px; flex-shrink: 0;
    }

    /* ── MapLibre popup overrides ── */
    .maplibregl-popup-content {
      background: #1a1d27;
      color: #e0e0e0;
      border: 1px solid #2a2d3e;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 13px;
      line-height: 1.7;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .maplibregl-popup-anchor-bottom .maplibregl-popup-tip { border-top-color: #1a1d27; }
    .maplibregl-popup-anchor-top    .maplibregl-popup-tip { border-bottom-color: #1a1d27; }
    .maplibregl-popup-close-button { color: #9e9e9e; font-size: 18px; padding: 4px 8px; }
    .maplibregl-popup-close-button:hover { color: #fff; background: transparent; }
  </style>
</head>
<body>

  <div id="header">
    <span style="font-size:22px">🔧</span>
    <h1>Pipe Digital Twin — Pipeline Monitor</h1>
  </div>

  <div id="map-wrap">
    <div id="map"></div>

    <!-- Legend -->
    <div id="legend">
      <h3>Status</h3>
      <div class="legend-row"><div class="legend-line" style="background:#4caf50"></div> Normal</div>
      <div class="legend-row"><div class="legend-line" style="background:#ff9800"></div> Warning</div>
      <div class="legend-row"><div class="legend-line" style="background:#f44336"></div> Anomaly</div>
      <div style="height:8px"></div>
      <div class="legend-row"><div class="legend-dot" style="background:#4caf50;box-shadow:0 0 6px #4caf50"></div> Node — Normal</div>
      <div class="legend-row"><div class="legend-dot" style="background:#ff9800;box-shadow:0 0 6px #ff9800"></div> Node — Warning</div>
      <div class="legend-row"><div class="legend-dot" style="background:#f44336;box-shadow:0 0 6px #f44336"></div> Node — Anomaly</div>
    </div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script>

    // ── CONSTANTS ─────────────────────────────────────────────────────────────────
    const STATE_COLOR = {
      normal:  '#4caf50',
      warning: '#ff9800',
      anomaly: '#f44336',
      unknown: '#9e9e9e',
    };

    function stateColor(state) { return STATE_COLOR[state] ?? STATE_COLOR.unknown; }
    function stateGlow(state)  {
      const c = stateColor(state);
      return `0 0 12px ${c}cc`;
    }

    // ── HARDCODED DATA ────────────────────────────────────────────────────────────
    // Each node "owns" one stretch of pipe (SEGMENT_PIPES[i] corresponds to NODES[i])
    const NODES = [
      { id: 0, name: "Segment A — Near Intake",  lng: 32.850, lat: 39.930, state: "normal",  temp: 67.5, trend: "stable" },
      { id: 1, name: "Segment B — Mid Run",       lng: 32.865, lat: 39.925, state: "normal",  temp: 68.0, trend: "stable" },
      { id: 2, name: "Segment C — Near Outflow",  lng: 32.880, lat: 39.920, state: "normal",  temp: 66.5, trend: "stable" },
    ];

    // Each segment's pipe geometry — consecutive segments share endpoints
    const SEGMENT_PIPES = [
      [[32.844, 39.932], [32.850, 39.930], [32.858, 39.9275]],   // Segment A
      [[32.858, 39.9275], [32.865, 39.925], [32.872, 39.9225]],  // Segment B
      [[32.872, 39.9225], [32.880, 39.920], [32.886, 39.918]],   // Segment C
    ];

    function buildPipeGeoJSON(nodes) {
      return {
        type: 'FeatureCollection',
        features: nodes.map((node, i) => ({
          type: 'Feature',
          properties: { id: node.id, state: node.state },
          geometry: { type: 'LineString', coordinates: SEGMENT_PIPES[i] }
        }))
      };
    }

    // ── MAP INIT ──────────────────────────────────────────────────────────────────
    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          osm: {
            type: 'raster',
            tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
            tileSize: 256,
            attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
          }
        },
        layers: [{ id: 'osm-raster', type: 'raster', source: 'osm' }]
      },
      center: [32.865, 39.925],
      zoom: 13
    });

    map.addControl(new maplibregl.NavigationControl(), 'top-right');
    map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }), 'bottom-left');

    // Track marker DOM elements so we can update colors later
    const markerEls = new Map();  // nodeId → HTMLElement

    map.on('load', () => {

      // ── PIPE SEGMENTS (one per node, state-driven color) ──────────────────────
      map.addSource('pipes', { type: 'geojson', data: buildPipeGeoJSON(NODES) });

      // Soft glow under the coloured lines
      map.addLayer({
        id: 'pipes-glow',
        type: 'line',
        source: 'pipes',
        paint: { 'line-color': '#ffffff', 'line-width': 14, 'line-opacity': 0.08 }
      });

      map.addLayer({
        id: 'pipes-line',
        type: 'line',
        source: 'pipes',
        paint: {
          'line-width': 7,
          'line-cap': 'round',
          'line-join': 'round',
          'line-color': ['match', ['get', 'state'],
            'anomaly', '#f44336',
            'warning', '#ff9800',
            '#4caf50'   // default: normal / unknown
          ]
        }
      });

      // ── NODE MARKERS ───────────────────────────────────────────────────────────
      NODES.forEach(node => {
        const el = document.createElement('div');
        el.style.cssText = [
          'width:20px', 'height:20px', 'border-radius:50%',
          `background:${stateColor(node.state)}`,
          'border:3px solid #fff',
          `box-shadow:${stateGlow(node.state)}`,
          'cursor:pointer', 'transition:transform .15s ease',
        ].join(';');

        el.addEventListener('mouseenter', () => el.style.transform = 'scale(1.35)');
        el.addEventListener('mouseleave', () => el.style.transform = 'scale(1)');

        const popup = new maplibregl.Popup({ offset: 22 }).setHTML(`
          <strong style="font-size:14px">${node.name}</strong><br>
          <span style="color:#aaa">Temperature:</span> <b>${node.temp}&nbsp;°C</b><br>
          <span style="color:#aaa">State:</span>
            <b style="color:${stateColor(node.state)}">${node.state.toUpperCase()}</b><br>
          <span style="color:#aaa">Trend:</span> ${node.trend}
        `);

        new maplibregl.Marker({ element: el })
          .setLngLat([node.lng, node.lat])
          .setPopup(popup)
          .addTo(map);

        markerEls.set(node.id, el);
      });
    });

    // ── HELPER — update marker + pipe colors when node states change ──────────────
    function applyNodeStates(nodes) {
      nodes.forEach(node => {
        const el = markerEls.get(node.id);
        if (!el) return;
        el.style.background    = stateColor(node.state);
        el.style.boxShadow     = stateGlow(node.state);
      });

      if (map.getSource('pipes')) {
        map.getSource('pipes').setData(buildPipeGeoJSON(nodes));
      }
    }

  </script>
</body>
</html>
